name: Firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/**/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run unit tests on the host
        run: pio test -d firmware/controller -e native

      - name: Build controller firmware for ESP32
        run: pio run -d firmware/controller -e esp32dev
